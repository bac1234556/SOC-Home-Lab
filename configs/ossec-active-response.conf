<!--
  =============================================================================
  Wazuh Active Response Configuration Snippet
  Target File: /var/ossec/etc/ossec.conf (Wazuh Manager - Amazon Linux 2023)
  Target Agent: Windows 11 Endpoint (baclev)
  Author: Le Viet Bac (SOC Home Lab)
  Status: Architecture Analysis & Prototype (See Troubleshooting & Limitations)
  =============================================================================
  LƯU Ý QUAN TRỌNG:
  - Đây là ĐOẠN CẤU HÌNH TRÍCH ĐOẠN (Snippet), KHÔNG PHẢI file ossec.conf hoàn chỉnh.
  - Vị trí tích hợp: Chèn khối <command> và <active-response> vào bên trong thẻ
    gốc <ossec_config> của file /var/ossec/etc/ossec.conf trên Wazuh Manager.
  - Cần khởi động lại Wazuh Manager sau khi sửa: systemctl restart wazuh-manager
  =============================================================================
-->

<ossec_config>

  <!--
    1. KHAI BÁO COMMAND (Lệnh thực thi tại Endpoint)
    - name: Tên định danh cho hành động phản ứng.
    - executable: Kịch bản hoặc chương trình thực thi.
      Trên Windows Agent, Wazuh gọi file nhị phân/script tương ứng trong thư mục
      'active-response/bin' (mặc định: netsh.exe hoặc netsh.cmd).
    - timeout_allowed: Cho phép hoàn nguyên (rollback) quy tắc tường lửa sau khi hết timeout.
  -->
  <command>
    <name>win-firewall-drop</name>
    <executable>netsh.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!--
    2. KÍCH HOẠT ACTIVE RESPONSE
    - disabled: 'no' để bật tính năng.
    - command: Trỏ tới command 'win-firewall-drop' đã khai báo ở trên.
    - location: 'local' - Thực thi trực tiếp trên chính Agent phát sinh sự kiện (baclev).
    - rules_id: Kích hoạt khi phát hiện Rule 100500 (RDP Brute-force / Failed Logon 4625).
    - timeout: Thời gian duy trì chặn là 180 giây (3 phút) trước khi tự động gỡ block.
  -->
  <active-response>
    <disabled>no</disabled>
    <command>win-firewall-drop</command>
    <location>local</location>
    <rules_id>100500</rules_id>
    <timeout>180</timeout>
  </active-response>

</ossec_config>

<!--
  =============================================================================
  PHÂN TÍCH RỦI RO & KHUYẾN NGHỊ VẬN HÀNH (SOC ANALYST NOTES):
  =============================================================================
  1. Rủi ro DoS / Gián đoạn dịch vụ:
     - Tự động chặn IP dựa trên Event 4625 có rủi ro tự khóa tài khoản quản trị
       hoặc chặn nhầm Domain Controller / máy chủ nội bộ nếu người dùng gõ sai pass.
     - Khuyến nghị: Thiết lập white-list (danh sách trắng) các dải IP quản trị
       trước khi triển khai ra môi trường production.

  2. Hạn chế kỹ thuật trên Windows EventChannel (Root Cause):
     - Wazuh netsh.exe mặc định đọc trường 'srcip' tĩnh từ luồng JSON.
     - Windows EventChannel cho Event 4625 lại lưu IP trong trường động
       'data.win.eventdata.ipAddress'.
     - Do sự không tương thích tên trường (Field Mismatch), kịch bản mặc định
       không lấy được IP để add firewall rule.
     - Giải pháp đề xuất: Viết custom script PowerShell (wrapper) đọc STDIN JSON,
       trích xuất parameters.alert.data.win.eventdata.ipAddress và gọi New-NetFirewallRule.

  3. Hướng dẫn Rollback an toàn trên Windows Endpoint (PowerShell / CMD Admin):
     - Kiểm tra các rule tường lửa hiện tại:
         netsh advfirewall firewall show rule name=all
     - Xóa rule chặn do Wazuh hoặc script tạo:
         netsh advfirewall firewall delete rule name="Wazuh-Block-IP"
     - Khôi phục cấu hình tường lửa mặc định (khi cần thiết khẩn cấp):
         netsh advfirewall reset
  =============================================================================
-->
