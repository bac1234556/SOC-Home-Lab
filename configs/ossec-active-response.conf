<!--
  Trích đoạn cấu hình từ /var/ossec/etc/ossec.conf trên Wazuh Manager (Amazon Linux)
  Cấu hình Command và Active Response kích hoạt khi nổ Rule 100500
-->
<ossec_config>
  <!-- Khai báo lệnh gọi thực thi chặn IP trên tường lửa Windows -->
  <command>
    <name>win-firewall-drop</name>
    <executable>netsh.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Kích hoạt phản ứng tự động tại Agent khi Rule 100500 (Event 4625) nổ -->
  <active-response>
    <disabled>no</disabled>
    <command>win-firewall-drop</command>
    <location>local</location>
    <rules_id>100500</rules_id>
    <timeout>180</timeout>
  </active-response>
</ossec_config>
