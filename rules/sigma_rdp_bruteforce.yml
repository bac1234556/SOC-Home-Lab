title: Windows Single Failed Logon Attempt (Potential RDP/Network Brute-Force Precursor)
id: 8f4a2b10-5c1e-4a9b-8d2f-100500abcdef
status: test
description: >
  Phát hiện sự kiện đăng nhập thất bại đơn lẻ (Event ID 4625) với Logon Type 10 (RDP) hoặc 3 (Network).
  Quy tắc này đóng vai trò là Base Rule; trong hệ thống SIEM (Wazuh), nó được kết hợp với quy tắc tương quan (Correlation Rule)
  để đếm ngưỡng tần suất (>= 5 lần trong 60 giây từ cùng một IP nguồn) nhằm xác định chính xác tấn công Brute-Force
  thực sự và giảm thiểu cảnh báo giả (False Positives).
author: Le Viet Bac (SOC Home Lab)
date: 2026/10/07
modified: 2026/10/19
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType:
      - 10  # RemoteInteractive (RDP)
      - 3   # Network (SMB / PsExec)
  condition: selection
falsepositives:
  - Người dùng nhập sai mật khẩu cá nhân trong quá trình làm việc hàng ngày.
  - Các tiến trình nền hoặc ứng dụng lưu thông tin xác thực cũ sau khi đổi mật khẩu tài khoản.
level: medium
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001

